---
# Keeps chatterino-slim on top of upstream Chatterino without a human.
#
# Release lane: merges the upstream master commit the latest release was cut
# from (merging release tags conflicts, see docs/dev/slim-fork.md) into an
# upstream-sync/<commit> branch and opens a pull request that merges itself
# once slim-gate passes. An open sync pull request is kept current with main
# instead of starting another. slim-tag.yml tags the merge as a release.
#
# Master lane: merges upstream master (what upstream's nightly builds are
# made from) into a throwaway branch and runs Slim CI on it, so breakage is
# found before upstream releases it. It never touches main.
#
# Failures become one GitHub issue per lane and stage (label slim-incident).
# A daily T3 Code task picks those up; see "Unattended repair" in the guide.
#
# Writes use a token of the chatterino-slim-sync GitHub App (Contents,
# Workflows and Pull requests read/write): GITHUB_TOKEN can't push upstream's
# workflow changes, and its pushes and pull requests don't start other
# workflows. The app's client ID is the SYNC_APP_CLIENT_ID variable. Its
# private key, SYNC_APP_PRIVATE_KEY, is in Infisical (kub-homelab, prod,
# /projects/chatterino-slim/ci), read over GitHub OIDC with the identity in
# the INFISICAL_GITHUB_ACTIONS_IDENTITY_ID variable. That identity only
# accepts runs on main.
name: Slim upstream sync

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch or tag for the release lane (empty: the master commit the latest release was cut from)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: slim-upstream-sync
  cancel-in-progress: false

jobs:
  release:
    name: "Release lane"
    runs-on: arc-chatterino-slim
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.pr.outputs.result || steps.merge.outputs.result }}
      label: ${{ steps.merge.outputs.label }}
      target: ${{ steps.merge.outputs.target }}
      pr: ${{ steps.pr.outputs.open || steps.open.outputs.number }}
    steps:
      - name: Fetch app key from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          domain: "http://192.168.60.11:8080"
          project-slug: kub-homelab
          env-slug: prod
          secret-path: /projects/chatterino-slim/ci

      - name: Check app setup
        env:
          CLIENT_ID: ${{ vars.SYNC_APP_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "${SYNC_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::Set up the sync GitHub App (see docs/dev/slim-fork.md)"
            exit 1
          fi

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ env.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "chatterino-slim sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Branch protection only merges pull requests that are current with
      # main, and auto-merge doesn't update them
      - name: Keep the open sync pull request current
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # A failed query must fail the step, not look like no open PR
          prs=$(gh pr list --label upstream-sync --state open \
            --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"')
          if [ -z "$prs" ]; then
            exit 0
          fi
          read -r number head <<< "$(head -n 1 <<< "$prs")"
          echo "open=$number" >> "$GITHUB_OUTPUT"
          no_auto_merge=$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest == null')
          git fetch --quiet origin "refs/heads/$head"
          git switch --quiet -C "$head" FETCH_HEAD
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Sync pull request #$number is current with main." >> "$GITHUB_STEP_SUMMARY"
            echo "result=pending" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit -m "Merge main into $head" origin/main; then
            git push --quiet origin "HEAD:refs/heads/$head"
            echo "Merged main into sync pull request #$number." >> "$GITHUB_STEP_SUMMARY"
            echo "result=updated" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "### Sync pull request #$number conflicts with main" >> "$GITHUB_STEP_SUMMARY"
            echo "result=update-conflict" >> "$GITHUB_OUTPUT"
          fi
          # Enabling it may have failed when the PR was opened. Last, because
          # a PR that already passes merges, and its branch goes, right away
          if [ "$no_auto_merge" = true ]; then
            gh pr merge "$number" --auto --merge
          fi

      # Only one sync pull request at a time; a newer release follows once
      # the open one is merged
      - name: Merge upstream
        id: merge
        if: steps.pr.outputs.open == ''
        env:
          UPSTREAM_REF: ${{ inputs.ref }}
        # The incidents job reports a missing result
        run: bash scripts/slim/merge-upstream.sh --push || true

      - name: Open pull request
        id: open
        if: steps.merge.outputs.result == 'merged' || steps.merge.outputs.result == 'exists'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          LABEL: ${{ steps.merge.outputs.label }}
          TARGET: ${{ steps.merge.outputs.target }}
        run: |
          url=$(gh pr create --base main --head "$BRANCH" --label upstream-sync \
            --title "Merge $LABEL (${TARGET:0:10})" \
            --body "Opened by the upstream sync. It merges by itself once slim-gate passes, and the merge is tagged as the next slim release. If it fails, the daily repair task opens an agent thread: see [Unattended repair](../blob/main/docs/dev/slim-fork.md#unattended-repair).")
          # A merge commit keeps upstream's history, which later syncs rely on
          gh pr merge "$url" --auto --merge
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"

  master:
    name: "Master lane"
    needs: release
    # Runs after the release lane, whatever its outcome
    if: ${{ !cancelled() }}
    runs-on: arc-chatterino-slim
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.merge.outputs.result || steps.tested.outputs.result }}
      branch: ${{ steps.merge.outputs.branch }}
      target: ${{ steps.merge.outputs.target }}
      main: ${{ steps.key.outputs.main }}
    steps:
      - name: Fetch app key from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_GITHUB_ACTIONS_IDENTITY_ID }}
          domain: "http://192.168.60.11:8080"
          project-slug: kub-homelab
          env-slug: prod
          secret-path: /projects/chatterino-slim/ci

      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ env.SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "chatterino-slim sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A pair of fork and upstream commits is tested once
      - name: Key
        id: key
        run: |
          main=$(git rev-parse HEAD)
          master=$(git ls-remote https://github.com/Chatterino/chatterino2.git refs/heads/master | cut -f 1)
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "key=slim-master-lane-$main-$master" >> "$GITHUB_OUTPUT"

      - name: Look up earlier test
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .slim-master-lane
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Already tested
        id: tested
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "result=tested" >> "$GITHUB_OUTPUT"
          echo "This main and upstream master already passed." >> "$GITHUB_STEP_SUMMARY"

      # Test branches belong to this job alone; drop ones a cancelled run left
      - name: Merge upstream master
        id: merge
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          UPSTREAM_REF: master
          BRANCH: upstream-master-test/${{ steps.key.outputs.main }}
        run: |
          git ls-remote --heads origin 'upstream-master-test/*' | cut -f 2 |
            while read -r ref; do git push --quiet origin --delete "$ref"; done
          bash scripts/slim/merge-upstream.sh --push --branch "$BRANCH" || true

  master-test:
    name: "Master lane test"
    needs: master
    # Without a status check this would inherit a release lane failure
    if: ${{ !cancelled() && needs.master.result == 'success' && needs.master.outputs.result == 'merged' }}
    uses: ./.github/workflows/slim-ci.yml
    with:
      ref: ${{ needs.master.outputs.branch }}

  master-done:
    name: "Master lane cleanup"
    needs: [master, master-test]
    if: ${{ !cancelled() && needs.master.outputs.result == 'merged' }}
    # Same runner as the lookup: the cache key's version depends on the
    # runner's compression tools
    runs-on: arc-chatterino-slim
    permissions:
      contents: write
    steps:
      - name: Remember the passed pair
        if: needs.master-test.result == 'success'
        run: mkdir -p .slim-master-lane && touch .slim-master-lane/passed

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.master-test.result == 'success'
        with:
          path: .slim-master-lane
          key: slim-master-lane-${{ needs.master.outputs.main }}-${{ needs.master.outputs.target }}

      - name: Delete test branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.master.outputs.branch }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"

  incidents:
    name: "Record incidents"
    needs: [release, master, master-test, master-done]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close incident issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_JOB: ${{ needs.release.result }}
          RELEASE_RESULT: ${{ needs.release.outputs.result }}
          RELEASE_LABEL: ${{ needs.release.outputs.label }}
          RELEASE_TARGET: ${{ needs.release.outputs.target }}
          RELEASE_PR: ${{ needs.release.outputs.pr }}
          MASTER_JOB: ${{ needs.master.result }}
          MASTER_RESULT: ${{ needs.master.outputs.result }}
          MASTER_TARGET: ${{ needs.master.outputs.target }}
          MASTER_MAIN: ${{ needs.master.outputs.main }}
          MASTER_TEST: ${{ needs.master-test.result }}
          MASTER_DONE: ${{ needs.master-done.result }}
        with:
          script: |
            const e = process.env;
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const stage = (job, result, test) => {
              if (job !== 'success' || !result) return 'controller';
              if (['conflict', 'new-workflow', 'update-conflict'].includes(result)) return result;
              if (result === 'merged' && test !== undefined && test !== 'success') return 'test';
              return '';
            };
            const lanes = [
              {
                lane: 'release',
                stage: stage(e.RELEASE_JOB, e.RELEASE_RESULT),
                details: `Release lane: ${e.RELEASE_LABEL || 'unknown target'} ` +
                  `(\`${e.RELEASE_TARGET || '?'}\`), result \`${e.RELEASE_RESULT || 'none'}\`` +
                  (e.RELEASE_PR ? `, sync pull request #${e.RELEASE_PR}` : ''),
              },
              {
                lane: 'master',
                stage: e.MASTER_DONE === 'failure' ? 'controller'
                  : stage(e.MASTER_JOB, e.MASTER_RESULT, e.MASTER_TEST),
                details: `Master lane: upstream master \`${e.MASTER_TARGET || '?'}\` into ` +
                  `main \`${e.MASTER_MAIN || '?'}\`, result \`${e.MASTER_RESULT || 'none'}\`, ` +
                  `test \`${e.MASTER_TEST}\``,
              },
            ];
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, labels: 'slim-incident', state: 'open' });
            for (const { lane, stage, details } of lanes) {
              const marker = `<!-- slim-incident ${lane} ${stage} -->`;
              const mine = open.filter(i => (i.body || '').includes(`<!-- slim-incident ${lane} `));
              for (const issue of mine) {
                if (stage && issue.body.includes(marker)) continue;
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: stage ? `The ${lane} lane now fails at \`${stage}\` instead: ${run}`
                              : `Resolved in ${run}.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed' });
              }
              if (!stage) continue;
              const existing = mine.find(i => i.body.includes(marker));
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: `Still failing in ${run}.\n\n${details}` });
              } else {
                await github.rest.issues.create({ owner, repo, labels: ['slim-incident'],
                  title: `Upstream sync: ${lane} lane fails at ${stage}`,
                  body: `${marker}\nThe daily upstream sync failed: ${run}\n\n${details}\n\n` +
                    'The run summary has the details. The daily repair task works on this issue; ' +
                    'see [Unattended repair](../blob/main/docs/dev/slim-fork.md#unattended-repair). ' +
                    'The issue closes itself once the lane passes again.' });
              }
            }
